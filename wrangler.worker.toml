name = "painelure-cloudflare"
main = "worker/index.js"
compatibility_date = "2026-09-08"

[assets]
directory = ".cloudflare-worker-public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "painelure-cloudflare"
database_id = "COLOQUE_O_DATABASE_ID_AQUI"
migrations_dir = "migrations"

[vars]
# Configure with: npx wrangler secret put PAINELURE_ADMIN_KEY --config=wrangler.worker.toml
