plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android { namespace 'com.painelure.app'; compileSdk 36
    buildDir = file("$rootDir/build-output-v57")
    defaultConfig { applicationId 'com.painelure.app'; minSdk 26; targetSdk 36; versionCode 139; versionName '11.10.0' }
    buildTypes { release { signingConfig signingConfigs.debug } }
    buildFeatures { compose true }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.withType(Test).configureEach {
    reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results-alt/$name")
    binaryResultsDirectory = layout.buildDirectory.dir("test-results-alt/$name/binary")
}
kotlin { jvmToolchain(17) }
dependencies {
    def bom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation bom
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
