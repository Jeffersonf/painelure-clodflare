<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Supervisores — PainelURE</title>
  <link rel="stylesheet" href="supervision-original.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    :root {
      --ac: #6366f1;
      --ac2: #06b6d4;
      --fut: #818cf8;
      --dan: #ef4444;
      --warn: #f59e0b;
      --grn: #10b981;
      --bg: #090c15;
      --bg2: #0f1422;
      --sf: rgba(18, 24, 38, 0.88);
      --sf2: rgba(26, 34, 54, 0.75);
      --sf-solid: #121826;
      --bd: rgba(255, 255, 255, 0.08);
      --bd2: rgba(255, 255, 255, 0.05);
      --tx: #f8fafc;
      --tx2: rgba(248, 250, 252, 0.78);
      --mt: #94a3b8;
      --sh: rgba(0, 0, 0, 0.4);
      --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    [data-theme="light"] {
      --ac: #4f46e5;
      --ac2: #0284c7;
      --fut: #6366f1;
      --dan: #dc2626;
      --warn: #d97706;
      --grn: #059669;
      --bg: #f1f5f9;
      --bg2: #e2e8f0;
      --sf: rgba(255, 255, 255, 0.95);
      --sf2: rgba(248, 250, 252, 0.9);
      --sf-solid: #ffffff;
      --bd: rgba(0, 0, 0, 0.12);
      --bd2: rgba(0, 0, 0, 0.06);
      --tx: #090d16;
      --tx2: rgba(9, 13, 22, 0.78);
      --mt: #64748b;
      --sh: rgba(0, 0, 0, 0.08);
    }
    html, body { min-height: 0; height: auto; overflow: visible; font-family: var(--font-ui); background: transparent; }
    body { padding: 18px 24px 36px; }
    .supervision-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 18px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 16px;
      box-shadow: 0 4px 20px var(--sh);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .supervision-toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .supervision-toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .month-switcher {
      display: inline-flex;
      align-items: center;
      background: var(--sf2);
      border: 1px solid var(--bd);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .month-step {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      color: var(--tx);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .month-step:hover {
      background: rgba(99, 102, 241, 0.15);
      color: var(--ac);
    }
    .month-pill {
      background: transparent;
      border: 0;
      color: var(--tx);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: -0.2px;
    }
    .btn-p {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
      color: #fff !important;
      border: 1px solid rgba(99, 102, 241, 0.4) !important;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      transition: all 0.18s ease;
    }
    .btn-p:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .supervision-progress-track {
      flex-basis: 100%;
      height: 4px;
      background: var(--bd2);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 4px;
      display: none;
    }
    .supervision-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    #supervisionStatus {
      flex-basis: 100%;
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--mt);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-page-header {
      display: flex !important;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .detail-page-header > div:first-child {
      display: block !important;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--bd);
      border-radius: 12px;
      background: var(--sf);
      color: var(--tx);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition: all .16s ease;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: var(--sf2);
      border-color: var(--ac);
      color: var(--ac);
      transform: translateX(-2px);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="supervision-toolbar">
    <div class="supervision-toolbar-left">
      <div class="month-switcher" aria-label="Selecionar mês">
        <button class="month-step" data-month-prev type="button" aria-label="Mês anterior">‹</button>
        <button class="month-pill" data-month-current type="button">Carregando...</button>
        <button class="month-step" data-month-next type="button" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div class="supervision-toolbar-right">
      <button class="btn btn-p btn-sm" id="retrySupervision" type="button">🔄 Atualizar dados</button>
    </div>
    <div class="supervision-progress-track" id="supervisionProgressBar">
      <div class="supervision-progress-fill" id="supervisionProgressFill"></div>
    </div>
    <p id="supervisionStatus" role="status" aria-live="polite">Carregando a planilha oficial…</p>
  </div>
  <section class="page active supervision-original-page" id="page-supervision">
    <header class="page-header compact supervision-original-head">
      <div><h1>Supervisores</h1><p>Cards de resumo por supervisor. Clique em um supervisor para abrir os dados completos.</p></div>
    </header>
    <div id="supervisorRows"></div>
  </section>
  <section class="page" id="page-supervisor-detail">
    <header class="page-header compact detail-page-header">
      <button class="back-btn" type="button" id="supervisionBack" aria-label="Voltar">‹</button>
      <div><h1 id="supervisorDetailTitle">Supervisor</h1><p>Metas, vínculos e acompanhamento.</p></div>
    </header>
    <div class="supervisor-detail" id="supervisorDetailPageBody"></div>
  </section>
  <script src="../data/schools.js"></script>
  <script src="../data/supervision.js"></script>
  <script src="../data/sources.js"></script>
  <script src="../modules/dom.js"></script>
  <script src="../modules/identity.js"></script>
  <script src="../modules/month-state.js"></script>
  <script src="../modules/search.js"></script>
  <script src="../modules/csv.js"></script>
  <script src="../modules/normalizers.js"></script>
  <script src="../modules/source-loader.js"></script>
  <script src="../modules/supervision-render.js"></script>
  <script src="../modules/supervision-page.js?v=20260914-2"></script>
</body>
</html>
